<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AstraLab | Titration Analysis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --theme-color: #00ff00; --bg-black: #050000; }
        body { background: var(--bg-black); color: white; font-family: 'Courier New', monospace; overflow: hidden; }
        .cyber-panel { background: rgba(10,30,10,0.8); border: 1px solid var(--theme-color); }
        #flaskLiquid { transition: background-color 0.5s ease, height 0.5s ease; }
        button.action-btn { background: var(--theme-color); color: black; font-weight: bold; padding: 10px; text-transform: uppercase; cursor: pointer; transition: 0.3s; border: none; }
        button.action-btn:hover { background: white; box-shadow: 0 0 15px white; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="h-screen flex flex-col p-4">

    <div id="safetyModal" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/90 backdrop-blur-sm transition-opacity duration-500">
        <div class="cyber-panel p-8 max-w-md w-full text-center relative shadow-[0_0_30px_var(--theme-color)]">
            <h2 class="text-2xl font-black text-[var(--theme-color)] mb-4 tracking-widest uppercase" id="ui-safe-title">Safety Protocol</h2>
            <div class="text-sm text-gray-300 mb-8 leading-relaxed" id="ui-safe-body"></div>
            <button id="ackBtn" class="bg-[var(--theme-color)] text-black font-bold px-8 py-3 w-full uppercase tracking-widest hover:bg-white transition" id="ui-safe-btn">Acknowledge</button>
        </div>
    </div>

    <header class="flex justify-between items-center mb-4">
        <a href="dashboard.html" id="ui-abort" class="text-[var(--theme-color)] text-[10px] uppercase font-bold hover:text-white transition">← Abort Module</a>
        <h1 class="text-xl font-black uppercase tracking-widest" id="ui-title">Titration Analysis</h1>
    </header>

    <div class="flex-1 grid grid-cols-1 md:grid-cols-3 gap-4 min-h-0">
        
        <div class="col-span-1 md:col-span-1 cyber-panel p-6 flex flex-col items-center justify-center rounded-sm relative">
            <h3 class="text-xs text-[var(--theme-color)] uppercase font-bold absolute top-4 left-4" id="ui-buret">Burette Control</h3>
            
            <div class="w-8 h-32 border-x-2 border-b-2 border-gray-400 mt-10 relative">
                <div class="absolute bottom-0 w-full bg-white opacity-50" style="height: 80%;"></div>
                <div class="absolute -bottom-4 left-3 w-2 h-4 bg-gray-500"></div>
            </div>

            <button onclick="addBase()" class="action-btn mt-8 text-[10px] px-8 py-2" id="ui-add">Add 1mL NaOH</button>
            <div class="text-[10px] mt-2 text-gray-400"><span id="ui-tot">Total Added</span>: <span id="volLab" class="text-white">0</span> mL</div>

            <div class="w-24 h-24 border-x-4 border-b-4 border-gray-400 rounded-b-xl mt-12 relative overflow-hidden flex items-end">
                <div id="flaskLiquid" class="w-full bg-white/10" style="height: 30%;"></div>
            </div>
            
            <div class="mt-4 text-center">
                <div class="text-[10px] uppercase text-[var(--theme-color)] font-bold" id="ui-ph">Live pH Level</div>
                <div id="phDisplay" class="text-4xl font-black text-white drop-shadow-[0_0_10px_rgba(0,255,0,0.5)]">2.00</div>
            </div>
        </div>

        <div class="col-span-1 md:col-span-2 cyber-panel p-6 relative rounded-sm">
            <h3 class="text-[10px] text-gray-500 uppercase absolute top-4 left-4" id="ui-curve">Titration Curve (pH vs Vol)</h3>
            <div class="w-full h-full pt-6">
                <canvas id="phChart"></canvas>
            </div>
        </div>
    </div>

    <div id="aiChatWidget" class="fixed bottom-6 right-6 z-50 flex flex-col items-end font-mono">
        <div id="aiChatWindow" class="hidden cyber-panel w-80 h-96 mb-4 flex-col rounded-sm overflow-hidden transition-opacity duration-300 opacity-0" style="background: rgba(5,15,5,0.95);">
            <div class="bg-[var(--theme-color)] text-black font-black p-3 text-sm flex justify-between items-center tracking-widest">
                <span>ASTRA_CORE</span><button id="closeChatBtn" class="hover:text-white transition px-2">X</button>
            </div>
            <div id="chatMessages" class="flex-1 p-4 overflow-y-auto space-y-4 text-xs scrollbar-hide"></div>
            <form id="chatForm" class="p-2 border-t border-[var(--theme-color)] flex items-center bg-black">
                <span class="text-[var(--theme-color)] ml-2">></span>
                <input type="text" id="aiChatInput" class="flex-1 bg-transparent text-white outline-none text-xs px-2 py-2" autocomplete="off">
                <button type="submit" class="text-[var(--theme-color)] font-bold px-3 py-1 border border-[var(--theme-color)] hover:bg-[var(--theme-color)] hover:text-black">SEND</button>
            </form>
        </div>
        <button id="aiToggleBtn" class="bg-black border-2 border-[var(--theme-color)] text-[var(--theme-color)] w-14 h-14 rounded-full shadow-[0_0_15px_var(--theme-color)] font-black text-lg z-50 cursor-pointer">AI</button>
    </div>

    <script>
        // --- TRANSLATIONS & SAFETY ---
        const userLang = localStorage.getItem('astraLanguage') || 'en';
        const t = {
            en: { abort: "← Abort Module", title: "Titration Analysis", buret: "Burette Control", add: "Add 1mL NaOH", tot: "Total Added", ph: "Live pH Level", curve: "Titration Curve", aiGreeting: "I am ASTRA. Ask me about titration.", safeTitle: "LAB SAFETY PROTOCOL", safeBody: "⚠️ WARNING: Corrosive Chemicals. Always wear safety goggles and lab coats. Strong acids and bases can cause severe skin burns. Know the location of the eye-wash station.", safeBtn: "ACKNOWLEDGE" },
            hi: { abort: "← वापस जाएं", title: "अनुमापन (Titration)", buret: "ब्यूरेट नियंत्रण", add: "1mL NaOH जोड़ें", tot: "कुल जोड़ा गया", ph: "पीएच (pH) स्तर", curve: "अनुमापन वक्र", aiGreeting: "मैं ASTRA हूँ। अनुमापन के बारे में पूछें।", safeTitle: "सुरक्षा प्रोटोकॉल", safeBody: "⚠️ चेतावनी: संक्षारक रसायन। हमेशा सुरक्षा चश्मे पहनें। मजबूत एसिड त्वचा को जला सकते हैं।", safeBtn: "स्वीकार करें" },
            te: { abort: "← వెనుకకు", title: "టైట్రేషన్ (Titration)", buret: "బ్యూరెట్ నియంత్రణ", add: "1mL NaOH కలపండి", tot: "మొత్తం కలిపినది", ph: "pH స్థాయి", curve: "టైట్రేషన్ వక్రరేఖ", aiGreeting: "నేను ASTRA. టైట్రేషన్ గురించి అడగండి.", safeTitle: "ప్రయోగశాల భద్రత", safeBody: "⚠️ హెచ్చరిక: రసాయనాలు. ఎల్లప్పుడూ భద్రతా కళ్లద్దాలు ధరించండి. ఆమ్లాలు చర్మాన్ని కాల్చగలవు.", safeBtn: "అంగీకరిస్తున్నాను" },
            ta: { abort: "← திரும்பு", title: "அளவறி பகுப்பாய்வு", buret: "பியூரெட் கட்டுப்பாடு", add: "1mL NaOH சேர்க்க", tot: "மொத்தம் சேர்த்தது", ph: "pH நிலை", curve: "பகுப்பாய்வு வளைவு", aiGreeting: "நான் ASTRA. பகுப்பாய்வு பற்றி கேளுங்கள்.", safeTitle: "பாதுகாப்பு நெறிமுறை", safeBody: "⚠️ எச்சரிக்கை: இரசாயனங்கள். எப்போதும் பாதுகாப்பு கண்ணாடிகள் அணியுங்கள். அமிலங்கள் தோலை எரிக்கலாம்.", safeBtn: "ஒப்புக்கொள்" }
        }[userLang] || t['en'];

        document.getElementById('ui-abort').innerText = t.abort; document.getElementById('ui-title').innerText = t.title;
        document.getElementById('ui-buret').innerText = t.buret; document.getElementById('ui-add').innerText = t.add;
        document.getElementById('ui-tot').innerText = t.tot; document.getElementById('ui-ph').innerText = t.ph;
        document.getElementById('ui-curve').innerText = t.curve;
        document.getElementById('ui-safe-title').innerText = t.safeTitle; document.getElementById('ui-safe-body').innerText = t.safeBody; document.getElementById('ackBtn').innerText = t.safeBtn;

        document.getElementById('ackBtn').addEventListener('click', () => {
            const modal = document.getElementById('safetyModal');
            modal.style.opacity = '0'; setTimeout(() => modal.style.display = 'none', 500);
        });

        // --- TITRATION ENGINE ---
        let volumeAdded = 0, currentPH = 2.0, chart;
        const flask = document.getElementById('flaskLiquid'), phDisplay = document.getElementById('phDisplay'), volLab = document.getElementById('volLab');

        function initChart() {
            const ctx = document.getElementById('phChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line', data: { labels: [0], datasets: [{ label: 'pH', data: [2.0], borderColor: '#00ff00', backgroundColor: 'rgba(0,255,0,0.1)', borderWidth: 3, tension: 0.4, pointRadius: 4, pointBackgroundColor: 'white' }] },
                options: { responsive: true, maintainAspectRatio: false, scales: { x: { title: { display: true, text: 'Volume (mL)', color: '#888' } }, y: { min: 0, max: 14 } }, plugins: { legend: { display: false } } }
            });
        }
        initChart();

        function addBase() {
            volumeAdded += 1;
            if(volumeAdded < 20) currentPH += 0.1; else if(volumeAdded >= 20 && volumeAdded < 24) currentPH += 0.4;
            else if(volumeAdded >= 24 && volumeAdded <= 26) currentPH += 2.5; else currentPH += 0.15;
            if(currentPH > 13.5) currentPH = 13.5;

            volLab.innerText = volumeAdded; phDisplay.innerText = currentPH.toFixed(2);
            let liquidHeight = 30 + (volumeAdded); if(liquidHeight > 95) liquidHeight = 95;
            flask.style.height = liquidHeight + "%";

            if(currentPH < 8.2) { flask.style.backgroundColor = "rgba(255, 255, 255, 0.1)"; } 
            else { let alpha = Math.min((currentPH - 8.0) / 4, 0.9); flask.style.backgroundColor = `rgba(255, 0, 200, ${alpha})`; }

            chart.data.labels.push(volumeAdded); chart.data.datasets[0].data.push(currentPH); chart.update();
        }

        // --- AI CHATBOT ---
        const GEMINI_API_KEY = 'PASTE_YOUR_API_KEY_HERE';
        const chatMessages = document.getElementById('chatMessages');
        chatMessages.innerHTML = `<div class="text-[var(--theme-color)]">> ${t.aiGreeting}</div>`;
        document.getElementById('aiToggleBtn').addEventListener('click', () => { document.getElementById('aiChatWindow').classList.toggle('hidden'); setTimeout(()=>document.getElementById('aiChatWindow').classList.toggle('opacity-0'),10); });
        document.getElementById('closeChatBtn').addEventListener('click', () => { document.getElementById('aiChatWindow').classList.add('opacity-0'); setTimeout(()=>document.getElementById('aiChatWindow').classList.add('hidden'),300); });
        document.getElementById('chatForm').addEventListener('submit', async (e) => {
            e.preventDefault(); const input = document.getElementById('aiChatInput'); const text = input.value.trim(); if(!text) return;
            chatMessages.innerHTML += `<div class="text-white text-right ml-8 mt-2"><span class="opacity-50 text-[10px]">USER</span><br>${text}</div>`; input.value = '';
            const sysPrompt = `You are Astra. The user speaks ${userLang.toUpperCase()}. Reply ONLY in ${userLang.toUpperCase()}. Keep answers under 3 sentences. User asks: `;
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_API_KEY}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: sysPrompt + text }] }] }) });
                const data = await response.json();
                chatMessages.innerHTML += `<div class="text-[var(--theme-color)] mr-8 mt-2">> ${data.candidates[0].content.parts[0].text.replace(/\*\*(.*?)\*\*/g, '<span class="text-white font-bold">$1</span>')}</div>`;
            } catch (error) { chatMessages.innerHTML += `<div class="text-red-500">> Error.</div>`; }
            chatMessages.scrollTop = chatMessages.scrollHeight;
        });
    </script>
</body>
</html>
