<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AstraLab | Friction Dynamics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --theme-color: #00ffff; }
        body { background: #050000; color: white; font-family: 'Courier New', monospace; overflow: hidden; }
        .glass-panel { background: rgba(0, 20, 30, 0.8); border: 1px solid var(--theme-color); box-shadow: 0 0 20px rgba(0, 255, 255, 0.1); backdrop-filter: blur(5px); }
        .cyber-range { accent-color: var(--theme-color); width: 100%; cursor: pointer; }
        .cyber-select { background: #000; color: var(--theme-color); border: 1px solid var(--theme-color); padding: 5px; outline: none; }
        #track { border-bottom: 4px solid #333; position: relative; height: 150px; overflow: hidden; }
        #block { width: 60px; height: 60px; background: rgba(0, 255, 255, 0.2); border: 2px solid var(--theme-color); position: absolute; bottom: 0; left: 50px; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="p-8 flex flex-col items-center min-h-screen">

    <div id="safetyModal" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/90 backdrop-blur-sm transition-opacity duration-500">
        <div class="glass-panel p-8 max-w-md w-full text-center relative shadow-[0_0_30px_var(--theme-color)]">
            <h2 class="text-2xl font-black text-[var(--theme-color)] mb-4 tracking-widest uppercase" id="ui-safe-title">Safety Protocol</h2>
            <div class="text-sm text-gray-300 mb-8 leading-relaxed" id="ui-safe-body"></div>
            <button id="ackBtn" class="bg-[var(--theme-color)] text-black font-bold px-8 py-3 w-full uppercase tracking-widest hover:bg-white transition" id="ui-safe-btn">Acknowledge</button>
        </div>
    </div>

    <header class="text-center mb-8 w-full max-w-4xl flex justify-between items-center">
        <div><h1 class="text-3xl font-black uppercase text-[var(--theme-color)]" id="ui-title">Friction Engine</h1></div>
        <a href="dashboard.html" id="ui-abort" class="text-[var(--theme-color)] border border-[var(--theme-color)] px-4 py-2 text-sm hover:bg-[var(--theme-color)] hover:text-black">Abort to Main</a>
    </header>

    <div class="glass-panel w-full max-w-4xl p-6 mb-6">
        <div class="grid grid-cols-3 gap-6 mb-6">
            <div>
                <label class="block text-xs text-gray-400 mb-2" id="ui-surf">Surface Material</label>
                <select id="surface" class="cyber-select w-full">
                    <option value="ice" id="ui-ice">Ice (μs: 0.1, μk: 0.03)</option>
                    <option value="wood" id="ui-wood" selected>Wood (μs: 0.4, μk: 0.3)</option>
                    <option value="concrete" id="ui-conc">Concrete (μs: 0.8, μk: 0.6)</option>
                </select>
            </div>
            <div>
                <label class="block text-xs text-gray-400 mb-2"><span id="ui-mass">Mass</span> (kg): <span id="massVal" class="text-[var(--theme-color)]">10</span></label>
                <input type="range" id="mass" min="1" max="50" value="10" class="cyber-range">
            </div>
            <div>
                <label class="block text-xs text-gray-400 mb-2"><span id="ui-force">Applied Force</span> (N): <span id="forceVal" class="text-[var(--theme-color)]">0</span></label>
                <input type="range" id="force" min="0" max="500" value="0" class="cyber-range">
            </div>
        </div>

        <div class="grid grid-cols-4 gap-4 text-center border-t border-gray-700 pt-4">
            <div><p class="text-[10px] text-gray-500" id="ui-stat">MAX STATIC</p><p id="statFricOut" class="text-lg font-bold text-yellow-400">0.0</p></div>
            <div><p class="text-[10px] text-gray-500" id="ui-kin">KINETIC FRIC</p><p id="kinFricOut" class="text-lg font-bold text-orange-400">0.0</p></div>
            <div><p class="text-[10px] text-gray-500" id="ui-net">NET FORCE</p><p id="netForceOut" class="text-lg font-bold text-red-400">0.0</p></div>
            <div><p class="text-[10px] text-gray-500" id="ui-acc">ACCELERATION</p><p id="accelOut" class="text-lg font-bold text-[var(--theme-color)]">0.0</p></div>
        </div>
    </div>

    <div class="glass-panel w-full max-w-4xl p-2">
        <div id="track"><div id="block">10kg</div></div>
        <div class="flex justify-between mt-2 px-4">
            <button id="resetBtn" class="text-xs border border-gray-500 px-3 py-1 hover:bg-gray-800">Reset</button>
        </div>
    </div>

    <div id="aiChatWidget" class="fixed bottom-6 right-6 z-50 flex flex-col items-end font-mono">
        <div id="aiChatWindow" class="hidden glass-panel w-80 h-96 mb-4 flex-col rounded-sm overflow-hidden transition-opacity duration-300 opacity-0" style="background: rgba(5,5,5,0.95);">
            <div class="bg-[var(--theme-color)] text-black font-black p-3 text-sm flex justify-between items-center tracking-widest">
                <span>ASTRA_CORE</span><button id="closeChatBtn" class="hover:text-white transition px-2">X</button>
            </div>
            <div id="chatMessages" class="flex-1 p-4 overflow-y-auto space-y-4 text-xs scrollbar-hide"></div>
            <form id="chatForm" class="p-2 border-t border-[var(--theme-color)] flex items-center bg-black">
                <span class="text-[var(--theme-color)] ml-2">></span>
                <input type="text" id="aiChatInput" class="flex-1 bg-transparent text-white outline-none text-xs px-2 py-2" autocomplete="off">
                <button type="submit" class="text-[var(--theme-color)] font-bold px-3 py-1 border border-[var(--theme-color)] hover:bg-[var(--theme-color)] hover:text-black">SEND</button>
            </form>
        </div>
        <button id="aiToggleBtn" class="bg-black border-2 border-[var(--theme-color)] text-[var(--theme-color)] w-14 h-14 rounded-full shadow-[0_0_15px_var(--theme-color)] font-black text-lg z-50 cursor-pointer">AI</button>
    </div>

    <script>
        // --- TRANSLATIONS & SAFETY ---
        const userLang = localStorage.getItem('astraLanguage') || 'en';
        const t = {
            en: { abort: "Abort Module", title: "Friction Engine", surf: "Surface", mass: "Mass", force: "Applied Force", stat: "STATIC", kin: "KINETIC", net: "NET", acc: "ACCEL", res: "Reset Block", ice:"Ice", wood:"Wood", conc:"Concrete", ai: "I am ASTRA. Ask about physics.", safeTitle: "LAB SAFETY PROTOCOL", safeBody: "⚠️ WARNING: Keep track clear. Secure all heavy weights properly to avoid crushing hazards. Do not pinch fingers under the block.", safeBtn: "ACKNOWLEDGE" },
            hi: { abort: "वापस जाएं", title: "घर्षण इंजन", surf: "सतह", mass: "द्रव्यमान", force: "लगाया गया बल", stat: "स्थैतिक", kin: "गतिज", net: "कुल बल", acc: "त्वरण", res: "रीसेट", ice:"बर्फ", wood:"लकड़ी", conc:"कंक्रीट", ai: "मैं ASTRA हूँ। भौतिकी के बारे में पूछें।", safeTitle: "सुरक्षा प्रोटोकॉल", safeBody: "⚠️ चेतावनी: ट्रैक साफ रखें। कुचलने के खतरों से बचने के लिए सभी भारी वजन को ठीक से सुरक्षित करें।", safeBtn: "स्वीकार करें" },
            te: { abort: "వెనుకకు", title: "ఘర్షణ ఇంజిన్", surf: "ఉపరితలం", mass: "ద్రవ్యరాశి", force: "వర్తించిన బలం", stat: "స్థిరమైన", kin: "గతిజ", net: "నికర బలం", acc: "త్వరణం", res: "రీసెట్ చేయండి", ice:"మంచు", wood:"చెక్క", conc:"కాంక్రీటు", ai: "నేను ASTRA. అడగండి.", safeTitle: "ప్రయోగశాల భద్రత", safeBody: "⚠️ హెచ్చరిక: భారీ బరువులను సరిగ్గా భద్రపరచండి. వేళ్లు నలిగిపోకుండా జాగ్రత్త పడండి.", safeBtn: "అంగీకరిస్తున్నాను" },
            ta: { abort: "திரும்பு", title: "உராய்வு இயந்திரம்", surf: "மேற்பரப்பு", mass: "நிறை", force: "பயன்படுத்தப்பட்ட விசை", stat: "நிலையான", kin: "இயக்க", net: "நிகர விசை", acc: "முடுக்கம்", res: "மீட்டமை", ice:"பனி", wood:"மரம்", conc:"கான்கிரீட்", ai: "நான் ASTRA. கேளுங்கள்.", safeTitle: "பாதுகாப்பு நெறிமுறை", safeBody: "⚠️ எச்சரிக்கை: பாதையை தெளிவாக வைத்திருக்கவும். அதிக எடைகளை பாதுகாப்பாக கையாளவும்.", safeBtn: "ஒப்புக்கொள்" }
        }[userLang] || t['en'];

        document.getElementById('ui-abort').innerText = t.abort; document.getElementById('ui-title').innerText = t.title;
        document.getElementById('ui-surf').innerText = t.surf; document.getElementById('ui-mass').innerText = t.mass;
        document.getElementById('ui-force').innerText = t.force; document.getElementById('ui-stat').innerText = t.stat;
        document.getElementById('ui-kin').innerText = t.kin; document.getElementById('ui-net').innerText = t.net;
        document.getElementById('ui-acc').innerText = t.acc; document.getElementById('resetBtn').innerText = t.res;
        document.getElementById('ui-ice').innerText = t.ice; document.getElementById('ui-wood').innerText = t.wood; document.getElementById('ui-conc').innerText = t.conc;
        
        document.getElementById('ui-safe-title').innerText = t.safeTitle; document.getElementById('ui-safe-body').innerText = t.safeBody; document.getElementById('ackBtn').innerText = t.safeBtn;

        // Safety Modal Logic
        document.getElementById('ackBtn').addEventListener('click', () => {
            const modal = document.getElementById('safetyModal');
            modal.style.opacity = '0'; setTimeout(() => modal.style.display = 'none', 500);
        });

        // --- FRICTION ENGINE ---
        const materials = { ice: { us: 0.1, uk: 0.03, color: '#e0ffff' }, wood: { us: 0.4, uk: 0.3, color: '#8b5a2b' }, concrete: { us: 0.8, uk: 0.6, color: '#555555' } };
        const g = 9.81; let pos = 50, vel = 0, lastTime = performance.now();
        const ui = { surface: document.getElementById('surface'), mass: document.getElementById('mass'), force: document.getElementById('force'), block: document.getElementById('block'), track: document.getElementById('track'), massVal: document.getElementById('massVal'), forceVal: document.getElementById('forceVal'), statFricOut: document.getElementById('statFricOut'), kinFricOut: document.getElementById('kinFricOut'), netForceOut: document.getElementById('netForceOut'), accelOut: document.getElementById('accelOut') };

        document.getElementById('resetBtn').addEventListener('click', () => { pos = 50; vel = 0; ui.force.value = 0; ui.forceVal.innerText = 0; updatePhysics(); });
        ui.surface.addEventListener('change', () => { ui.track.style.borderBottomColor = materials[ui.surface.value].color; updatePhysics(); });
        ui.mass.addEventListener('input', (e) => { ui.massVal.innerText = e.target.value; ui.block.innerText = e.target.value + 'kg'; updatePhysics(); });
        ui.force.addEventListener('input', (e) => { ui.forceVal.innerText = e.target.value; });

        function updatePhysics() {
            const now = performance.now(), dt = Math.min((now - lastTime) / 1000, 0.1); lastTime = now;
            const m = parseFloat(ui.mass.value), fApp = parseFloat(ui.force.value), mat = materials[ui.surface.value], normalForce = m * g;
            const fStatMax = mat.us * normalForce, fKin = mat.uk * normalForce;
            let fNet = 0, a = 0;

            ui.statFricOut.innerText = fStatMax.toFixed(1); ui.kinFricOut.innerText = fKin.toFixed(1);

            if (vel > 0.01) { fNet = fApp - fKin; a = fNet / m; } 
            else { if (fApp > fStatMax) { fNet = fApp - fKin; a = fNet / m; } else { fNet = 0; a = 0; vel = 0; } }

            ui.netForceOut.innerText = fNet.toFixed(1); ui.accelOut.innerText = a.toFixed(2);
            vel += a * dt; if (vel < 0) vel = 0; pos += vel * dt * 20;
            if (pos > ui.track.offsetWidth - 60) { pos = ui.track.offsetWidth - 60; vel = 0; }
            ui.block.style.left = pos + 'px'; requestAnimationFrame(updatePhysics);
        }
        ui.track.style.borderBottomColor = materials.wood.color; updatePhysics();

        // --- AI CHATBOT ---
        const GEMINI_API_KEY = 'PASTE_YOUR_API_KEY_HERE';
        const chatMessages = document.getElementById('chatMessages');
        chatMessages.innerHTML = `<div class="text-[var(--theme-color)]">> ${t.ai}</div>`;
        document.getElementById('aiToggleBtn').addEventListener('click', () => { document.getElementById('aiChatWindow').classList.toggle('hidden'); setTimeout(()=>document.getElementById('aiChatWindow').classList.toggle('opacity-0'),10); });
        document.getElementById('closeChatBtn').addEventListener('click', () => { document.getElementById('aiChatWindow').classList.add('opacity-0'); setTimeout(()=>document.getElementById('aiChatWindow').classList.add('hidden'),300); });
        document.getElementById('chatForm').addEventListener('submit', async (e) => {
            e.preventDefault(); const input = document.getElementById('aiChatInput'); const text = input.value.trim(); if(!text) return;
            chatMessages.innerHTML += `<div class="text-white text-right ml-8 mt-2"><span class="opacity-50 text-[10px]">USER</span><br>${text}</div>`; input.value = '';
            const sysPrompt = `You are Astra. The user speaks ${userLang.toUpperCase()}. Reply ONLY in ${userLang.toUpperCase()}. Keep answers under 3 sentences. User asks: `;
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_API_KEY}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: sysPrompt + text }] }] }) });
                const data = await response.json();
                chatMessages.innerHTML += `<div class="text-[var(--theme-color)] mr-8 mt-2">> ${data.candidates[0].content.parts[0].text.replace(/\*\*(.*?)\*\*/g, '<span class="text-white font-bold">$1</span>')}</div>`;
            } catch (error) { chatMessages.innerHTML += `<div class="text-red-500">> Error.</div>`; }
            chatMessages.scrollTop = chatMessages.scrollHeight;
        });
    </script>
</body>
</html>
