<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AstraLab | Snell's Law</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --theme-color: #00ffff; }
        body { background: #050000; color: white; font-family: 'Courier New', monospace; overflow: hidden; }
        .panel { background: rgba(10,0,0,0.8); border: 1px solid var(--theme-color); }
        input[type=range] { -webkit-appearance: none; width: 100%; background: #003333; height: 4px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 20px; width: 20px; background: var(--theme-color); cursor: pointer; border-radius: 50%; box-shadow: 0 0 10px var(--theme-color);}
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="h-screen flex flex-col p-6">

    <div id="safetyModal" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/90 backdrop-blur-sm transition-opacity duration-500">
        <div class="panel p-8 max-w-md w-full text-center relative shadow-[0_0_30px_var(--theme-color)]">
            <h2 class="text-2xl font-black text-[var(--theme-color)] mb-4 tracking-widest uppercase" id="ui-safe-title">Safety Protocol</h2>
            <div class="text-sm text-gray-300 mb-8 leading-relaxed" id="ui-safe-body"></div>
            <button id="ackBtn" class="bg-[var(--theme-color)] text-black font-bold px-8 py-3 w-full uppercase tracking-widest hover:bg-white transition" id="ui-safe-btn">Acknowledge</button>
        </div>
    </div>

    <header class="flex justify-between items-center mb-6">
        <a href="dashboard.html" id="ui-abort" class="text-[var(--theme-color)] text-xs uppercase hover:text-white font-bold tracking-widest">← Abort Module</a>
        <h1 class="text-2xl font-black uppercase text-white" id="ui-title">Snell's Law <span class="text-[var(--theme-color)]">Matrix</span></h1>
    </header>

    <div class="flex-1 grid grid-cols-1 md:grid-cols-4 gap-6 min-h-0">
        <div class="col-span-1 panel p-6 flex flex-col justify-center rounded-sm">
            <h3 class="text-xs text-[var(--theme-color)] uppercase border-b border-[var(--theme-color)] pb-2 mb-6 font-bold" id="ui-calib">Laser Calibration</h3>
            
            <div class="mb-10">
                <label class="flex justify-between text-xs text-white mb-4"><span id="ui-ang">Angle of Incidence</span> <span id="angLab">45°</span></label>
                <input type="range" id="angSlide" min="0" max="85" value="45">
            </div>
            
            <div class="mb-10">
                <label class="flex justify-between text-xs text-white mb-4"><span id="ui-ref">Refractive Index</span> <span id="nLab">1.50</span></label>
                <input type="range" id="nSlide" min="1.00" max="2.50" step="0.05" value="1.50">
            </div>

            <div id="aiNotes" class="text-[10px] text-[var(--theme-color)] border-l-2 border-[var(--theme-color)] pl-2 mt-4 leading-relaxed font-mono"></div>
        </div>

        <div id="opticsContainer" class="col-span-1 md:col-span-3 relative panel bg-[#020000] rounded-sm min-h-[300px]">
            <canvas id="opticsCanvas" class="w-full h-full absolute inset-0"></canvas>
        </div>
    </div>

    <div id="aiChatWidget" class="fixed bottom-6 right-6 z-50 flex flex-col items-end font-mono">
        <div id="aiChatWindow" class="hidden panel w-80 h-96 mb-4 flex-col rounded-sm overflow-hidden transition-opacity duration-300 opacity-0" style="background: rgba(5,5,5,0.95);">
            <div class="bg-[var(--theme-color)] text-black font-black p-3 text-sm flex justify-between items-center tracking-widest">
                <span>ASTRA_CORE</span><button id="closeChatBtn" class="hover:text-white transition px-2">X</button>
            </div>
            <div id="chatMessages" class="flex-1 p-4 overflow-y-auto space-y-4 text-xs scrollbar-hide"></div>
            <form id="chatForm" class="p-2 border-t border-[var(--theme-color)] flex items-center bg-black">
                <span class="text-[var(--theme-color)] ml-2">></span>
                <input type="text" id="aiChatInput" class="flex-1 bg-transparent text-white outline-none text-xs px-2 py-2" autocomplete="off">
                <button type="submit" class="text-[var(--theme-color)] font-bold px-3 py-1 border border-[var(--theme-color)] hover:bg-[var(--theme-color)] hover:text-black">SEND</button>
            </form>
        </div>
        <button id="aiToggleBtn" class="bg-black border-2 border-[var(--theme-color)] text-[var(--theme-color)] w-14 h-14 rounded-full shadow-[0_0_15px_var(--theme-color)] font-black text-lg z-50 cursor-pointer">AI</button>
    </div>

    <script>
        // --- TRANSLATIONS & SAFETY ---
        const userLang = localStorage.getItem('astraLanguage') || 'en';
        const t = {
            en: { abort: "← Abort Module", title: "Snell's Law Matrix", calib: "Laser Calibration", ang: "Angle of Incidence", ref: "Refractive Index", med1: "Medium 1 (Air)", med2: "Medium 2", aiGreeting: "I am ASTRA. Ask me anything about optics.", safeTitle: "LAB SAFETY PROTOCOL", safeBody: "⚠️ WARNING: Class 2 Lasers in use. Never look directly into the laser beam. Beware of stray reflections. Handle glass blocks carefully to prevent cuts.", safeBtn: "ACKNOWLEDGE" },
            hi: { abort: "← वापस जाएं", title: "स्नेल का नियम", calib: "लेजर अंशांकन", ang: "आपतन कोण", ref: "अपवर्तनांक", med1: "माध्यम 1 (हवा)", med2: "माध्यम 2", aiGreeting: "मैं ASTRA हूँ। प्रकाशिकी के बारे में कुछ भी पूछें।", safeTitle: "सुरक्षा प्रोटोकॉल", safeBody: "⚠️ चेतावनी: लेजर बीम को सीधे न देखें। भटके हुए प्रतिबिंबों से सावधान रहें। कांच के ब्लॉकों को सावधानी से संभालें।", safeBtn: "स्वीकार करें" },
            te: { abort: "← వెనుకకు", title: "స్నెల్ నియమం", calib: "లేజర్ కాలిబ్రేషన్", ang: "పతన కోణం", ref: "వక్రీభవన గుణకం", med1: "యానకం 1 (గాలి)", med2: "యానకం 2", aiGreeting: "నేను ASTRA. ఆప్టిక్స్ గురించి అడగండి.", safeTitle: "ప్రయోగశాల భద్రత", safeBody: "⚠️ హెచ్చరిక: లేజర్ కిరణాన్ని నేరుగా చూడకండి. గాజు బ్లాకులను జాగ్రత్తగా నిర్వహించండి.", safeBtn: "అంగీకరిస్తున్నాను" },
            ta: { abort: "← திரும்பு", title: "ஸ்நெல் விதி", calib: "லேசர் அளவுத்திருத்தம்", ang: "படுகோணம்", ref: "ஒளிவிலகல் எண்", med1: "ஊடகம் 1 (காற்று)", med2: "ஊடகம் 2", aiGreeting: "நான் ASTRA. ஒளியியல் பற்றி கேளுங்கள்.", safeTitle: "பாதுகாப்பு நெறிமுறை", safeBody: "⚠️ எச்சரிக்கை: லேசர் கற்றையை நேரடியாக பார்க்க வேண்டாம். கண்ணாடி தொகுதிகளை கவனமாக கையாளவும்.", safeBtn: "ஒப்புக்கொள்" }
        }[userLang] || t['en'];

        document.getElementById('ui-abort').innerText = t.abort; document.getElementById('ui-title').innerHTML = t.title;
        document.getElementById('ui-calib').innerText = t.calib; document.getElementById('ui-ang').innerText = t.ang;
        document.getElementById('ui-ref').innerText = t.ref;
        document.getElementById('ui-safe-title').innerText = t.safeTitle; document.getElementById('ui-safe-body').innerText = t.safeBody; document.getElementById('ackBtn').innerText = t.safeBtn;

        // Safety Modal Logic
        document.getElementById('ackBtn').addEventListener('click', () => {
            const modal = document.getElementById('safetyModal');
            modal.style.opacity = '0'; setTimeout(() => modal.style.display = 'none', 500);
        });

        // --- OPTICS ENGINE ---
        const canvas = document.getElementById('opticsCanvas'); const ctx = canvas.getContext('2d');
        const angSlide = document.getElementById('angSlide'); const nSlide = document.getElementById('nSlide');
        
        function resize() { canvas.width = document.getElementById('opticsContainer').clientWidth; canvas.height = document.getElementById('opticsContainer').clientHeight; drawOptics(); }
        window.addEventListener('resize', resize);
        
        function drawOptics() {
            ctx.clearRect(0,0, canvas.width, canvas.height);
            let cx = canvas.width / 2, cy = canvas.height / 2;
            let theta1 = parseInt(angSlide.value), n2 = parseFloat(nSlide.value), n1 = 1.0;
            
            document.getElementById('angLab').innerText = theta1 + "°"; document.getElementById('nLab').innerText = n2.toFixed(2);

            ctx.fillStyle = 'rgba(0, 255, 255, 0.1)'; ctx.fillRect(0, cy, canvas.width, canvas.height/2);
            ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(canvas.width, cy); ctx.stroke();
            
            ctx.fillStyle = '#00ffff'; ctx.font = "14px monospace";
            ctx.fillText(`${t.med2} (n=${n2.toFixed(2)})`, 20, canvas.height - 20); ctx.fillText(`${t.med1} (n=1.0)`, 20, 30);
            ctx.strokeStyle = 'gray'; ctx.setLineDash([5, 10]); ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, canvas.height); ctx.stroke(); ctx.setLineDash([]);

            let rad1 = theta1 * (Math.PI / 180);
            let sinTheta2 = (n1 * Math.sin(rad1)) / n2;
            let rad2 = Math.asin(sinTheta2);
            let theta2 = (rad2 * (180 / Math.PI)).toFixed(1);

            let startX = cx - Math.sin(rad1) * 1000, startY = cy - Math.cos(rad1) * 1000;
            ctx.strokeStyle = '#ff003c'; ctx.lineWidth = 4; ctx.shadowBlur = 15; ctx.shadowColor = '#ff003c';
            ctx.beginPath(); ctx.moveTo(startX, startY); ctx.lineTo(cx, cy); ctx.stroke();

            if (!isNaN(rad2)) {
                let endX = cx + Math.sin(rad2) * 1000, endY = cy + Math.cos(rad2) * 1000;
                ctx.strokeStyle = '#00ffff'; ctx.shadowColor = '#00ffff';
                ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(endX, endY); ctx.stroke();
                document.getElementById('aiNotes').innerHTML = `> AI: ${t.title} Calc<br>1.0 * sin(${theta1}°) = ${n2.toFixed(2)} * sin(θ₂)<br>θ₂ = <b>${theta2}°</b>`;
            } else { document.getElementById('aiNotes').innerText = "> AI: TOTAL INTERNAL REFLECTION."; }
            ctx.shadowBlur = 0;
        }
        angSlide.addEventListener('input', drawOptics); nSlide.addEventListener('input', drawOptics); resize();

        // --- AI CHATBOT ---
        const GEMINI_API_KEY = 'PASTE_YOUR_API_KEY_HERE';
        const chatMessages = document.getElementById('chatMessages');
        chatMessages.innerHTML = `<div class="text-[var(--theme-color)]">> ${t.aiGreeting}</div>`;
        document.getElementById('aiToggleBtn').addEventListener('click', () => { document.getElementById('aiChatWindow').classList.toggle('hidden'); setTimeout(()=>document.getElementById('aiChatWindow').classList.toggle('opacity-0'),10); });
        document.getElementById('closeChatBtn').addEventListener('click', () => { document.getElementById('aiChatWindow').classList.add('opacity-0'); setTimeout(()=>document.getElementById('aiChatWindow').classList.add('hidden'),300); });
        document.getElementById('chatForm').addEventListener('submit', async (e) => {
            e.preventDefault(); const input = document.getElementById('aiChatInput'); const text = input.value.trim(); if(!text) return;
            chatMessages.innerHTML += `<div class="text-white text-right ml-8 mt-2"><span class="opacity-50 text-[10px]">USER</span><br>${text}</div>`; input.value = '';
            const sysPrompt = `You are Astra. The user speaks ${userLang.toUpperCase()}. Reply ONLY in ${userLang.toUpperCase()}. Keep answers under 3 sentences. User asks: `;
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_API_KEY}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: sysPrompt + text }] }] }) });
                const data = await response.json();
                chatMessages.innerHTML += `<div class="text-[var(--theme-color)] mr-8 mt-2">> ${data.candidates[0].content.parts[0].text.replace(/\*\*(.*?)\*\*/g, '<span class="text-white font-bold">$1</span>')}</div>`;
            } catch (error) { chatMessages.innerHTML += `<div class="text-red-500">> Error.</div>`; }
            chatMessages.scrollTop = chatMessages.scrollHeight;
        });
    </script>
</body>
</html>
